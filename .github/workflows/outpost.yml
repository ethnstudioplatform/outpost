name: OUTPOST transmission

on:
  # Automatic 08:00 / 18:00 runs turned off 24 Sep 2026: the Claude "OUTPOST news desk"
  # scheduled task now picks the story and starts this workflow with a script.
  workflow_dispatch:
    inputs:
      demo:
        description: "Use placeholder test data"
        type: boolean
        default: false
      script:
        description: "Hand-written script file in fixtures/ (optional)"
        type: string
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: OUTPOST_UPLOAD

concurrency:
  group: outpost
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      made: ${{ steps.run.outputs.made }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: OUTPOST_UPLOAD/requirements.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Python packages
        run: |
          pip install -r requirements.txt
          pip install "kokoro-onnx>=0.4.9" || echo "kokoro-onnx install failed, Piper fallback will be used"

      - name: Cache font, voice, map
        uses: actions/cache@v4
        with:
          path: |
            OUTPOST_UPLOAD/assets/fonts
            OUTPOST_UPLOAD/assets/voices
            OUTPOST_UPLOAD/assets/kokoro
            OUTPOST_UPLOAD/assets/countries-50m.json
          key: outpost-assets-v5-${{ vars.OUTPOST_VOICE || 'en_GB-southern_english_female-low' }}

      - name: Fetch fonts, voices, map
        env:
          V: ${{ vars.OUTPOST_VOICE || 'en_GB-southern_english_female-low' }}
        run: |
          mkdir -p assets/fonts assets/voices assets/kokoro
          [ -f assets/fonts/Inter-Var.ttf ] || curl -fsSL -o assets/fonts/Inter-Var.ttf \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || rm -f assets/fonts/Inter-Var.ttf
          [ -f assets/fonts/IBMPlexMono-Regular.ttf ] || curl -fsSL -o assets/fonts/IBMPlexMono-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/ibmplexmono/IBMPlexMono-Regular.ttf || rm -f assets/fonts/IBMPlexMono-Regular.ttf
          [ -f assets/countries-50m.json ] || curl -fsSL -o assets/countries-50m.json \
            https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f assets/kokoro/kokoro-v1.0.onnx ] || curl -fsSL -o assets/kokoro/kokoro-v1.0.onnx $K/kokoro-v1.0.onnx || rm -f assets/kokoro/kokoro-v1.0.onnx
          [ -f assets/kokoro/voices-v1.0.bin ] || curl -fsSL -o assets/kokoro/voices-v1.0.bin $K/voices-v1.0.bin || rm -f assets/kokoro/voices-v1.0.bin
          ls -la assets/fonts assets/kokoro
          LANGR=${V%%-*}; REST=${V#*-}; Q=${REST##*-}; N=${REST%-*}; L=${LANGR%%_*}
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/$L/$LANGR/$N/$Q
          [ -f assets/voices/$V.onnx ] || curl -fsSL -o assets/voices/$V.onnx $B/$V.onnx
          [ -f assets/voices/$V.onnx.json ] || curl -fsSL -o assets/voices/$V.onnx.json $B/$V.onnx.json
          echo "OUTPOST_VOICE=$V" >> $GITHUB_ENV

      - name: Generate video
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: |
          if [ -n "${{ inputs.script }}" ]; then python run.py --script "${{ inputs.script }}";
          elif [ "${{ inputs.demo }}" = "true" ]; then python run.py --demo; else python run.py; fi
          if [ -f out/latest.txt ]; then
            echo "made=true" >> $GITHUB_OUTPUT
            echo "DIR=$(cat out/latest.txt)" >> $GITHUB_ENV
          else
            echo "made=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload draft
        if: steps.run.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: outpost-draft
          path: ${{ env.DIR }}
          retention-days: 7

      - name: Publish to TikTok via Buffer
        # On only when the repo variable BUFFER_AUTOPOST is "true" and the BUFFER_API_KEY secret exists.
        if: steps.run.outputs.made == 'true' && inputs.demo != true && vars.BUFFER_AUTOPOST == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_MODE: ${{ vars.BUFFER_MODE || 'shareNow' }}  # post as soon as the video is ready
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$DIR/outpost.mp4" --title "OUTPOST $TAG" --notes-file "$DIR/tiktok.txt"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/outpost.mp4"
          python publish.py --video-url "$URL" --caption-file "$DIR/tiktok.txt"
          # keep only the last 7 days of video releases
          CUT=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 200 --json tagName,createdAt --jq ".[] | select(.createdAt < \"$CUT\") | .tagName" \
            | xargs -r -n1 gh release delete --yes --cleanup-tag || true

      - name: Remember used headlines
        if: steps.run.outputs.made == 'true' && inputs.demo != true && inputs.script == ''
        run: |
          git config user.name "outpost-bot"
          git config user.email "outpost-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state: seen headlines" && git push)
