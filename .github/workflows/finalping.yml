name: thefinalping render

on:
  workflow_dispatch:
    inputs:
      melody:
        description: "Melody file in OUTPOST_UPLOAD/finalping/"
        type: string
        default: "mountain_king.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OUTPOST_UPLOAD/finalping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python packages
        run: pip install numpy
      - name: Render
        run: python ping.py "${{ inputs.melody }}" out.mp4
      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4 | cut -d. -f1)
          TITLE=$(python -c "import json;print(json.load(open('${{ inputs.melody }}')).get('title',''))")
          ffmpeg -y -loglevel error -sseof -2.2 -i out.mp4 -frames:v 1 -vf scale=180:320 thumb.jpg || true
          curl -sS -o resp.json -w "%{http_code}\n" \
            -F chat_id="$CHAT" -F video=@out.mp4 -F thumbnail=@thumb.jpg \
            -F width=1080 -F height=1920 -F duration="$DUR" -F supports_streaming=true \
            -F caption="thefinalping: $TITLE. No text, sound on. Post as is." \
            "https://api.telegram.org/bot$TOKEN/sendVideo"
          python -c "import json;r=json.load(open('resp.json'));print('telegram ok:', r.get('ok'))"
      - uses: actions/upload-artifact@v4
        with:
          name: thefinalping
          path: OUTPOST_UPLOAD/finalping/out.mp4
          retention-days: 7
