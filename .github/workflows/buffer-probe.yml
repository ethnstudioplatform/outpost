name: Buffer check

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OUTPOST_UPLOAD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: List the Buffer channels this key can see
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish.py --probe
